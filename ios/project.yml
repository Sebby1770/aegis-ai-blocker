name: AegisAIBlocker
options:
  bundleIdPrefix: com.sebby1770
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  AegisAIBlocker:
    type: application
    platform: iOS
    sources:
      - AegisAIBlocker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sebby1770.AegisAIBlocker
        INFOPLIST_FILE: AegisAIBlocker/Info.plist
        CODE_SIGN_STYLE: Automatic
    info:
      path: AegisAIBlocker/Info.plist
      properties:
        CFBundleDisplayName: Aegis AI Blocker
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
