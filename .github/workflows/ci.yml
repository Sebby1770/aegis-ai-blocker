name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generated blocklists and iOS rule data are in sync with the rule pack
        run: |
          npm run generate:rules
          git diff --exit-code rules/generated ios/AegisAIBlocker/RulePackData.generated.swift extension/rules/pack.json

      - name: Lint
        run: npm run lint

      - name: Typecheck API
        run: npm run typecheck:api

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: No server secrets in the client bundle
        run: npm run check:bundle

      - name: Audit dependencies
        run: npm audit --audit-level=high

  extension-e2e:
    name: Extension blocking in real Chromium (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Load the unpacked extension and verify what it blocks
        run: npm run test:e2e

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results
          retention-days: 7

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
