<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="popup.css" />
    <title>Aegis Enforcer</title>
  </head>
  <body>
    <header class="head">
      <div class="brand">
        <span class="mark" aria-hidden="true">▲</span>
        <div>
          <strong>Aegis Enforcer</strong>

    <div id="modes" class="modes" role="listbox" aria-label="Policy modes"></div>

    <footer class="foot">
      <span id="count" class="count">—</span>
