<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="popup.css" />
    <title>Aegis Enforcer</title>
  </head>
  <body>
    <header class="head">
      <div class="brand">
        <span class="mark" aria-hidden="true">▲</span>
        <div>
          <strong>Aegis Enforcer</strong>
          <span id="status" class="status">Loading…</span>
        </div>
      </div>
      <button id="pause" class="pause" type="button">Pause</button>
    </header>

    <p class="hint">Choose a value. AI services are blocked in real time across this browser.</p>

    <div id="modes" class="modes" role="listbox" aria-label="Policy modes"></div>

    <section class="friction" aria-labelledby="friction-label">
      <span id="friction-label" class="section-label">Friction</span>
      <div class="segmented" role="radiogroup" aria-labelledby="friction-label">
        <button type="button" role="radio" data-friction="block">Block</button>
        <button type="button" role="radio" data-friction="delay">Delay</button>
        <button type="button" role="radio" data-friction="schedule">Schedule</button>
      </div>

      <div id="delay-options" class="friction-options" hidden>
        <label>
          Pause for
          <select id="delay-seconds">
            <option value="5">5 s</option>
            <option value="10">10 s</option>
            <option value="15">15 s</option>
            <option value="30">30 s</option>
            <option value="60">60 s</option>
          </select>
        </label>
        <label>
          then open for
          <select id="pass-minutes">
            <option value="5">5 min</option>
            <option value="10">10 min</option>
            <option value="15">15 min</option>
            <option value="30">30 min</option>
            <option value="60">60 min</option>
          </select>
        </label>
      </div>

      <div id="schedule-options" class="friction-options" hidden>
        <div id="schedule-days" class="days" role="group" aria-label="Days">
          <label><input type="checkbox" value="1" /><span>Mo</span></label>
          <label><input type="checkbox" value="2" /><span>Tu</span></label>
          <label><input type="checkbox" value="3" /><span>We</span></label>
          <label><input type="checkbox" value="4" /><span>Th</span></label>
          <label><input type="checkbox" value="5" /><span>Fr</span></label>
          <label><input type="checkbox" value="6" /><span>Sa</span></label>
          <label><input type="checkbox" value="0" /><span>Su</span></label>
        </div>
        <label>From <input id="schedule-start" type="time" required /></label>
        <label>to <input id="schedule-end" type="time" required /></label>
      </div>

      <p id="friction-status" class="friction-status"></p>
    </section>

    <details class="exceptions">
      <summary>Exceptions</summary>
      <div class="exception-group">
        <label for="allow-input">Always allow</label>
        <form id="allow-form" class="exception-form">
          <input id="allow-input" placeholder="github.com" autocomplete="off" spellcheck="false" />
          <button type="submit">Add</button>
        </form>
        <div id="allow-list" class="chips" aria-label="Allowed domains"></div>
      </div>
      <div class="exception-group">
        <label for="block-input">Also block</label>
        <form id="block-form" class="exception-form">
          <input id="block-input" placeholder="my-ai.example.com" autocomplete="off" spellcheck="false" />
          <button type="submit">Add</button>
        </form>
        <div id="block-list" class="chips" aria-label="Extra blocked domains"></div>
      </div>
    </details>

    <footer class="foot">
      <span id="count" class="count">—</span>
      <span class="foot-right">
        <span id="pack" class="pack" title="Rule pack version">—</span>
        <button id="refresh" class="refresh" type="button" title="Fetch the latest rule pack">↻</button>
        <a href="https://github.com/Sebby1770/aegis-ai-blocker" target="_blank" rel="noreferrer">aegis</a>
      </span>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
